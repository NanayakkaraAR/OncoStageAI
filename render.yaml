databases:
  - name: oncostage-db
    databaseName: oncostage_db
    user: postgres
    plan: free

services:
  # 1. Machine Learning Service
  - type: web
    name: oncostage-ml-service
    env: docker
    rootDir: ml_service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /

  # 2. Node.js Backend
  - type: web
    name: oncostage-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    preDeployCommand: npx prisma db push
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: oncostage-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # You will enter this manually in the Render Dashboard
      - key: ML_SERVICE_URL
        value: http://oncostage-ml-service:8000/predict
      - key: ML_SERVICE_URL_PARSE
        value: http://oncostage-ml-service:8000/parse-report

  # 3. Angular Frontend
  - type: static_site
    name: oncostage-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist/onco-stage-ai/browser
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://oncostage-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
