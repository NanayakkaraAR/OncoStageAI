services:
  ml_service:
    build:
      context: ./ml_service
    container_name: oncostage_ml_service
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: oncostage_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oncostage_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: oncostage_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ML_SERVICE_URL: http://ml_service:8000/predict
      ML_SERVICE_URL_PARSE: http://ml_service:8000/parse-report
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oncostage_db?schema=public&sslmode=disable
      PRISMA_CLIENT_ENGINE_TYPE: binary
    env_file:
      - ./backend/.env
    depends_on:
      - ml_service
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: oncostage_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
